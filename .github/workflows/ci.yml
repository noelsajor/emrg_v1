name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [site-a, site-b, site-c, site-d, site-e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.site }}/package-lock.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --filter ${{ matrix.site }}

      - name: Type check
        continue-on-error: true
        run: pnpm --filter ${{ matrix.site }} astro check 2>&1 || echo "Type check skipped"

      - name: Build
        run: pnpm --filter ${{ matrix.site }} build
