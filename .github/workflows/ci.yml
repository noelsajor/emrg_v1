name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [site-a, site-b, site-c, site-d, site-e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.site }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.site }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.site }}
        continue-on-error: true
        run: npx astro check 2>&1 || echo "Type check skipped (astro check not available)"

      - name: Build
        working-directory: ${{ matrix.site }}
        run: npm run build
